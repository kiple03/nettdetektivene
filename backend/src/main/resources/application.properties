spring.application.name=backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

s3.endpoint=${S3_ENDPOINT}
s3.public-base-url=${S3_PUBLIC_BASE_URL}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket=${S3_BUCKET}
s3.region=us-east-1

server.servlet.context-path=/api

jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=300000
jwt.refresh-expiration-ms=604800000

# Refresh-token cookie Secure flag. False in dev so the cookie is sent over
# plain http://localhost. Override to true (e.g. via APP_COOKIE_SECURE env var
# or a prod profile) in any non-local environment.
app.cookie.secure=${APP_COOKIE_SECURE:false}

springdoc.swagger-ui.operationsSorter=path

app.cheats.enabled=${APP_CHEATS_ENABLED}